import java.nio.file.Files

plugins {
    alias(libs.plugins.architectury) apply false
    alias(libs.plugins.loom) apply false
    id 'com.gradleup.shadow' version '9.0.0' apply false
}

allprojects {
    apply plugin: 'java'

    group = 'io.ampznetwork.lunararc'
    version = libs.versions.project.version.get()

    ext {
        gitHash = { ->
            try {
                def out = new ByteArrayOutputStream()
                exec { commandLine 'git', 'rev-parse', '--short', 'HEAD'; standardOutput = out; ignoreExitValue = true }
                def h = out.toString().trim(); return h.isEmpty() ? 'unknown' : h
            } catch (ignored) { return 'unknown' }
        }()
        supportedPlatforms = ['neoforge', 'forge', 'fabric', 'quilt']
        buildName          = libs.versions.build.name.get()
        paperDir           = rootProject.file('.gradle/paper')
        paperServerJar     = rootProject.file(".gradle/paper/paper-server-${libs.versions.minecraft.get()}-${libs.versions.paper.build.get()}.jar")
    }

    repositories {
        mavenCentral()
        maven { url 'https://maven.neoforged.net/releases' }
        maven { url 'https://repo.papermc.io/repository/maven-public/' }
        maven { url 'https://repo.spongepowered.org/maven' }
        maven { url 'https://maven.parchmentmc.org' }
    }

    java {
        toolchain { languageVersion = JavaLanguageVersion.of(21) }
    }
}

// ── Download & extract Paper server JAR ───────────────────────────────────────
tasks.register('setupPaperServer') {
    outputs.file(rootProject.ext.paperServerJar)
    doLast {
        if (!rootProject.ext.paperServerJar.exists()) {
            rootProject.ext.paperDir.mkdirs()
            def mc    = libs.versions.minecraft.get()
            def build = libs.versions.paper.build.get()
            def url   = "https://api.papermc.io/v2/projects/paper/versions/${mc}/builds/${build}/downloads/paper-${mc}-${build}.jar"
            def bundler = new File(rootProject.ext.paperDir, 'paper-bundler.jar')
            try {
                println "Downloading Paper ${build} for MC ${mc}..."
                def conn = URI.create(url).toURL().openConnection()
                conn.connectTimeout = 30_000; conn.readTimeout = 120_000
                bundler.withOutputStream { it2 -> conn.inputStream.transferTo(it2) }
                println "Extracting paper-server from bundler..."
                def jar   = new java.util.jar.JarFile(bundler)
                def entry = jar.stream().filter { e -> e.name.startsWith('META-INF/versions/') && e.name.endsWith('.jar') }.findFirst().orElse(null)
                if (entry) {
                    rootProject.ext.paperServerJar.withOutputStream { it2 -> jar.getInputStream(entry).transferTo(it2) }
                } else {
                    Files.copy(bundler.toPath(), rootProject.ext.paperServerJar.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                }
                jar.close()
                println "Paper server JAR ready: ${rootProject.ext.paperServerJar}"
            } catch (Exception e) {
                println "WARNING: setupPaperServer failed (network?): ${e.message}"
            } finally {
                if (bundler.exists()) bundler.delete()
            }
        } else {
            println "Paper server JAR already present: ${rootProject.ext.paperServerJar}"
        }
    }
}

// ── Collect all platform fat-JARs into build/libs ─────────────────────────────
tasks.register('collect', Copy) {
    destinationDir = file('build/libs')
    from project(':bootstrap').tasks.named('neoforgeJar')
    from project(':bootstrap').tasks.named('forgeJar')
    from project(':bootstrap').tasks.named('fabricJar')
    from project(':bootstrap').tasks.named('quiltJar')
}

jar.enabled = false
