[versions]
# plugins
architectury-loom = "1.17.493"
# loom builds: https://maven.architectury.dev/dev/architectury/architectury-loom/

# common
jetbrains-annotations = "26.1.0"
asm = "9.10.1"
mixin = "0.8.7"
mixinextras = "0.5.5"
parchment = "2025.12.20"

# lunararc
lunararc-api = "1.2.1"
project-version = "1.0.0-SNAPSHOT"
build-name = "Outland Bound"
java-runtime = "25"

# minecraft loaders dependencies
minecraft = "26.3"
forge = "66.0.13"
neoforge = "26.3.0.95"
fabric-loader = "0.20.1"
fabric-api = "0.164.0+26.3"
fabric-permissions-api = "0.7.0"
fabric-installer = "0.11.2"
quilt-loader = "0.30.1"
quilt-installer = "0.15.1"

# Paper dependencies
paper-build = "209"
data-version = "5023"
bungeecord-chat-api = "1.21-R0.4"
paper-api = "26.3.build.209-stable"
# paper-api:  https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/
# data-version: https://minecraft.wiki/w/Data_version

# LunarArc runtime libraries
adventure = "5.2.0"
fastutil = "8.5.19"
joml = "1.10.9"
slf4j = "2.0.20"
commons-lang = "2.6"
sqlite = "3.53.4.0"
snakeyaml = "2.7"
mysql-connector-j = "26.7.0"
log4j = "2.26.1"
jline = "4.4.6"
terminal-console-appender = "1.3.0"

[libraries]
# common
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }

# buildSrc
loom = { module = "dev.architectury:architectury-loom", version.ref = "architectury-loom" }
asm = { group = "org.ow2.asm", name = "asm", version.ref = "asm" }
asm-commons = { group = "org.ow2.asm", name = "asm-commons", version.ref = "asm" }
asm-tree = { group = "org.ow2.asm", name = "asm-tree", version.ref = "asm" }
mixin = { module = "org.spongepowered:mixin", version.ref = "mixin" }
mixinextras-common = { module = "io.github.llamalad7:mixinextras-common", version.ref = "mixinextras" }
lunararc-api = { group = "com.github.LunarArcDevs", name = "api", version.ref = "lunararc-api" }

# subProjects (lunararc-common, and others in platforms)
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
paper-api = { group = "io.papermc.paper", name = "paper-api", version.ref = "paper-api" }
bungeecord-chat-api = { group = "net.md-5", name = "bungeecord-chat", version.ref = "bungeecord-chat-api" }
snakeyaml = { group = "org.yaml", name = "snakeyaml", version.ref = "snakeyaml" }
mysql-connector-j = { group = "com.mysql", name = "mysql-connector-j", version.ref = "mysql-connector-j" }
sqlite-jdbc = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqlite" }
jline = { group = "org.jline", name = "jline", version.ref = "jline" }
terminal-console-appender = { group = "net.minecrell", name = "terminalconsoleappender", version.ref = "terminal-console-appender" }
log4j-api = { group = "org.apache.logging.log4j", name = "log4j-api", version.ref = "log4j" }
log4j-core = { group = "org.apache.logging.log4j", name = "log4j-core", version.ref = "log4j" }
adventure-api = { group = "net.kyori", name = "adventure-api", version.ref = "adventure" }
adventure-text-minimessage = { group = "net.kyori", name = "adventure-text-minimessage", version.ref = "adventure" }
adventure-text-serializer-gson = { group = "net.kyori", name = "adventure-text-serializer-gson", version.ref = "adventure" }
adventure-text-serializer-legacy = { group = "net.kyori", name = "adventure-text-serializer-legacy", version.ref = "adventure" }
adventure-text-serializer-plain = { group = "net.kyori", name = "adventure-text-serializer-plain", version.ref = "adventure" }
fastutil = { group = "it.unimi.dsi", name = "fastutil", version.ref = "fastutil" }
joml = { module = "org.joml:joml", version.ref = "joml" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
commons-lang = { group = "commons-lang", name = "commons-lang", version.ref = "commons-lang" }
json-simple = { group = "com.googlecode.json-simple", name = "json-simple", version = "1.1.1" }

# platforms (lunararc-forge, lunararc-fabric, lunararc-neoforge, lunararc-quilt)
neoforge = { group = "net.neoforged", name = "neoforge", version.ref = "neoforge" }
fabric-api = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fabric-api" }
fabric-permissions-api = { group = "me.lucko", name = "fabric-permissions-api", version.ref = "fabric-permissions-api" }
quilt-loader = { group = "org.quiltmc", name = "quilt-loader", version.ref = "quilt-loader" }

# installer
gson = { group = "com.google.code.gson", name = "gson", version = "2.14.0" }

[plugins]
architectury = { id = "architectury-plugin", version = "3.5.169" }
loom = { id = "dev.architectury.loom-no-remap", version.ref = "architectury-loom" }
