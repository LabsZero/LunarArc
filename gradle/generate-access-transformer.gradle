// Generates META-INF/accesstransformer.cfg from the shared access widener (NeoForge and Forge share the AT syntax).
def generatedAtDir = layout.buildDirectory.dir('generated/accesstransformer')

tasks.register('generateAccessTransformer') {
    def widener = project(':lunararc-common').file('src/main/resources/lunararc.accesswidener')
    def output = generatedAtDir.map { it.file('META-INF/accesstransformer.cfg').asFile }
    inputs.file(widener)
    outputs.file(output)

    doLast {
        def target = output.get()
        target.parentFile.mkdirs()
        def lines = ['# Generated from lunararc.accesswidener - do not edit by hand.']
        def dotted = { String internal -> internal.replace('/', '.') }
        def coremodOwnedFields = [
                'net/minecraft/world/level/biome/Biome climateSettings',
                'net/minecraft/world/level/biome/Biome specialEffects',
                // Forge's FieldToMethodTransformer redirects this field to a method and requires it to stay private.
                'net/minecraft/world/item/BucketItem content',
        ] as Set

        widener.eachLine { String raw ->
            def line = raw.trim()
            if (line.isEmpty() || line.startsWith('#') || line.startsWith('accessWidener')) return
            def parts = line.split('\\s+')
            if (parts.length < 3) return
            def access = parts[0]      // accessible | mutable | extendable
            def kind = parts[1]        // class | field | method

            switch (kind) {
                case 'class':
                    if (access == 'accessible' || access == 'extendable') {
                        lines << "public ${dotted(parts[2])}"
                    }
                    break
                case 'field':
                    if (parts.length < 5) return
                    if (coremodOwnedFields.contains("${parts[2]} ${parts[3]}".toString())) {
                        logger.lifecycle("Skipping coremod-owned field ${parts[2]}.${parts[3]} in the access transformer")
                        return
                    }
                    // accessible -> public; mutable -> also strip final (public-f).
                    def at = (access == 'mutable') ? 'public-f' : 'public'
                    lines << "${at} ${dotted(parts[2])} ${parts[3]}"
                    break
                case 'method':
                    if (parts.length < 5) return
                    lines << "public ${dotted(parts[2])} ${parts[3]}${parts[4]}"
                    break
            }
        }

        def byMember = [:]
        def header = lines.remove(0)
        lines.each { String entry ->
            def bits = entry.split(' ')
            def key = bits.length > 2 ? "${bits[1]} ${bits[2]}" : bits[1]
            def existing = byMember[key]
            if (existing == null || entry.startsWith('public-f')) byMember[key] = entry
        }
        target.text = ([header] + byMember.values().toSorted()).join('\n') + '\n'
        logger.lifecycle("Generated NeoForge access transformer with ${byMember.size()} entries")
    }
}

sourceSets.main.resources.srcDir(generatedAtDir)
tasks.named('processResources') { dependsOn tasks.named('generateAccessTransformer') }
