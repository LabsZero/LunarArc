# LunarArc incompatibility list.
#
# Plugins and mods LunarArc knows do not work on it. This is not operator
# configuration - it is the project stating what it knows - so it lives here,
# beside libs.versions.toml, and is baked into the jar at build time. There is
# no editable copy on a running server.
#
# Add an entry, rebuild, done.
#
#   name     plugin name from plugin.yml / paper-plugin.yml, or the loader's
#            mod ID. Matched case-insensitively.
#   version  exact version to match. Omit to cover every version. Pin one only
#            when another version genuinely works - a pin that outlives its
#            truth is worse than no entry, because it reads as a considered
#            judgement.
#   reason   shown to the operator verbatim. Write it as the line they will
#            read when their server refuses to load something: name the
#            symptom, and the version or alternative that works if there is
#            one.
#
# Plugins listed here are refused at load time and never constructed.
#
# Mods can only be warned about. The loader resolves and constructs them long
# before any LunarArc code runs, so nothing here can stop one - the warning
# names the mod and the reason, which at least turns "the server behaves
# strangely" into a line naming the cause.

# [[plugins]]
# name = "ExamplePlugin"
# version = "1.0.0"
# reason = "Crashes on NeoForge; use 1.0.1 or newer."

# [[mods]]
# name = "examplemod"
# reason = "Replaces the chunk system; conflicts with LunarArc's chunk handling."
