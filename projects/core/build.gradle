plugins {
    id 'architectury-plugin'
    id 'dev.architectury.loom'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    silentMojangMappingsLicense()
    accessWidenerPath = project(':lunararc-common').file("src/main/resources/lunararc.accesswidener")
}

dependencies {
    minecraft libs.minecraft
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${libs.versions.minecraft.get()}:${libs.versions.parchment.get()}@zip")
    }
    neoForge libs.neoforge
    implementation project(':lunararc-common')
    implementation project(':api')
    implementation libs.paper.api
}

// Exclude compile-only neoforgespi stubs — FancyModLoader provides the real classes at runtime.
tasks.named('jar') {
    exclude 'net/neoforged/neoforgespi/**'
}

processResources {
    inputs.property "version", project.version
    inputs.property "project_name", rootProject.name

    // neoforge.mods.toml uses FML's own ${file.jarVersion} variable for version,
    // which cannot coexist with Groovy's expand() template engine. Display name is hardcoded.
    filesMatching("META-INF/mods.toml") {
        expand(
                version: project.version,
                project_name: rootProject.name
        )
    }
}
