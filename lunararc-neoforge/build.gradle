// NeoForge platform integration — analogous to arclight-neoforge.
plugins {
    id 'architectury-plugin'
    id 'dev.architectury.loom'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    silentMojangMappingsLicense()
    accessWidenerPath = project(':lunararc-common').file('src/main/resources/lunararc.accesswidener')
}

dependencies {
    minecraft libs.minecraft
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${libs.versions.minecraft.get()}:${libs.versions.parchment.get()}@zip")
    }
    neoForge libs.neoforge
    implementation project(':lunararc-common')
    implementation project(':lunararc-api')
    implementation libs.paper.api
}

// Strip compile-only neoforgespi stubs — FancyModLoader provides the real classes at runtime.
tasks.named('jar') {
    exclude 'net/neoforged/neoforgespi/**'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'project_name', rootProject.name
    filesMatching('META-INF/mods.toml') {
        expand version: project.version, project_name: rootProject.name
    }
}
