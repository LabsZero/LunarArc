
plugins {
    id 'architectury-plugin'
    id 'dev.architectury.loom-no-remap'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    silentMojangMappingsLicense()
    accessWidenerPath = project(':lunararc-common').file('src/main/resources/lunararc.accesswidener')
}

dependencies {
    minecraft libs.minecraft
    neoForge libs.neoforge
    implementation project(':lunararc-common')
    implementation libs.lunararc.api
    implementation libs.paper.api
}

apply from: rootProject.file('gradle/generate-access-transformer.gradle')

tasks.named('jar') {
    exclude 'net/neoforged/neoforgespi/**'
}

processResources {
    def javaRuntime = libs.versions.java.runtime.get()
    inputs.property 'version', project.version
    inputs.property 'project_name', rootProject.name
    inputs.property 'java_runtime', javaRuntime

    filesMatching('mixins.lunararc.neoforge.json') {
        expand java_compatibility: "JAVA_${javaRuntime}"
    }
}
