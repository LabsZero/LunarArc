# This workflow will build a Java project with Gradle
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          generate-job-summary: false

      - name: Cache Loom / Paper setup
        uses: actions/cache@v4
        with:
          path: |
            .gradle/loom-cache
            .gradle/quilt-loom-cache
            .gradle/paper
            projects/core/.gradle
            projects/loaders/fabric/.gradle
            projects/loaders/forge/.gradle
            projects/loaders/quilt/.gradle
          key: loom-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            loom-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build & Assemble
        run: ./gradlew setupPaperServer build collect --no-daemon --stacktrace

      - name: List Artifacts
        run: ls -R build/libs

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LunarArc
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 90
