# This workflow will build a Java project with Gradle
# For more information see: https:

name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Java runtime requirement
        id: java-runtime
        shell: bash
        run: |
          java_runtime=$(awk -F '=' '/^java-runtime[[:space:]]*=/ {gsub(/[ "\r]/, "", $2); print $2; exit}' gradle/libs.versions.toml)
          test -n "$java_runtime" || { echo "java-runtime is missing from gradle/libs.versions.toml" >&2; exit 1; }
          echo "version=$java_runtime" >> "$GITHUB_OUTPUT"

      - name: Set up required JDK
        uses: actions/setup-java@v4
        with:
          java-version: '${{ steps.java-runtime.outputs.version }}'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Cache Loom / Paper setup
        uses: actions/cache@v4
        with:
          path: |
            .gradle/loom-cache
            .gradle/quilt-loom-cache
            .gradle/paper
            lunararc-neoforge/.gradle
            lunararc-fabric/.gradle
            lunararc-forge/.gradle
            lunararc-quilt/.gradle
          key: loom-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            loom-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build project and all four hybrid JARs
        run: |
          ./gradlew \
            setupPaperServer \
            build \
            :bootstrap:verifyNeoforgePaperSurface \
            :bootstrap:verifyForgePaperSurface \
            :bootstrap:verifyFabricPaperSurface \
            :bootstrap:verifyQuiltPaperSurface \
            --no-daemon \
            --stacktrace

      - name: Validate all loader artifacts
        shell: bash
        run: |
          set -euo pipefail

          for loader in neoforge forge fabric quilt; do
            if ! compgen -G "bootstrap/build/libs/lunararc-${loader}-*.jar" > /dev/null; then
              echo "::error::Missing LunarArc ${loader} JAR"
              echo "Contents of bootstrap/build/libs:"
              ls -lah bootstrap/build/libs || true
              exit 1
            fi
          done

          echo "All four LunarArc loader JARs are present:"
          ls -lah bootstrap/build/libs/lunararc-*.jar

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p build/artifacts
          cp bootstrap/build/libs/lunararc-neoforge-*.jar build/artifacts/
          cp bootstrap/build/libs/lunararc-forge-*.jar build/artifacts/
          cp bootstrap/build/libs/lunararc-fabric-*.jar build/artifacts/
          cp bootstrap/build/libs/lunararc-quilt-*.jar build/artifacts/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LunarArc
          path: build/artifacts/*.jar
          if-no-files-found: error
          retention-days: 90
