def generatedPaperImplementationSurfaceDir = layout.buildDirectory.dir('generated/paper-1.21.1-implementation-surface')

def ownsPaperImplementationClass = { String classEntry ->
    if (!classEntry.endsWith('.class')) return false
    String topLevel = classEntry.substring(0, classEntry.length() - '.class'.length())
    int inner = topLevel.indexOf('$')
    if (inner >= 0) topLevel = topLevel.substring(0, inner)
    File javaSource = project.file("src/main/java/${topLevel}.java")
    return javaSource.isFile()
}

tasks.register('verifyCraftNmsOwnership') {
    group = 'verification'
    description = 'Ensures CraftBlockStates is LunarArc-owned and derives BlockEntityType membership only through the public isValid(BlockState) API, never through BlockEntityType.validBlocks.'

    doLast {
        File craftBlockStates = project.file('src/main/java/org/bukkit/craftbukkit/block/CraftBlockStates.java')

        if (!craftBlockStates.isFile()) {
            throw new GradleException('Craft/NMS ownership check failed: CraftBlockStates must be a LunarArc-owned source file')
        }

        String craftSource = craftBlockStates.getText('UTF-8')
        if (craftSource =~ /(?m)^\s*[^\/\s].*\bblockEntityType\.validBlocks\b/) {
            throw new GradleException('CraftBlockStates must not directly access BlockEntityType.validBlocks; use the public isValid(BlockState) method instead')
        }
        // Current architecture (replaces the earlier BlockEntityTypeAccessBridge Mixin
        // approach, removed as obsolete): derive block membership via vanilla's own public
        // BlockEntityType#isValid(BlockState), which needs no private-field access and no
        // Mixin accessor at all.
        if (!craftSource.contains('blockEntityType.isValid(')) {
            throw new GradleException('CraftBlockStates is not deriving BlockEntityType membership through the public isValid(BlockState) API')
        }

        if (!craftSource.contains('GENERIC_BLOCK_ENTITY_FACTORY') || !craftSource.contains('return GENERIC_BLOCK_ENTITY_FACTORY')) {
            throw new GradleException('CraftBlockStates must retain the generic loader/mod BlockEntityType fallback')
        }
    }
}

tasks.register('preparePaperImplementationSurface') {
    dependsOn tasks.named('verifyCraftNmsOwnership')
    group = 'build setup'
    description = 'Extracts missing exact Paper 1.21.1 CraftBukkit/Spigot implementation classes, plus Paper\'s own loader-independent config framework (io.papermc.paper.configuration.*), for loader remapping.'
    dependsOn rootProject.tasks.named('preparePaperCompileReference')
    inputs.file(rootProject.ext.paperServerJar)
    inputs.files(fileTree('src/main/java') {
        include 'org/bukkit/craftbukkit/**/*.java'
        include 'org/spigotmc/**/*.java'
        include 'io/papermc/paper/configuration/**/*.java'
    })
    outputs.dir(generatedPaperImplementationSurfaceDir)

    doLast {
        File outputDir = generatedPaperImplementationSurfaceDir.get().asFile
        project.delete(outputDir)
        outputDir.mkdirs()

        File paperJar = rootProject.ext.paperServerJar
        if (!paperJar.isFile()) {
            throw new GradleException("Paper 1.21.1 implementation reference is missing: ${paperJar}")
        }

        List<String> unownedValidBlocksUsers = []
        new java.util.jar.JarFile(paperJar).withCloseable { auditJar ->
            auditJar.entries().each { entry ->
                if (entry.directory || !entry.name.endsWith('.class')) return
                if (!(entry.name.startsWith('org/bukkit/craftbukkit/') || entry.name.startsWith('org/spigotmc/'))) return
                if (ownsPaperImplementationClass(entry.name)) return
                byte[] bytes = auditJar.getInputStream(entry).withCloseable { it.readAllBytes() }
                String constants = new String(bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                if (constants.contains('net/minecraft/world/level/block/entity/BlockEntityType') &&
                        constants.contains('validBlocks')) {
                    unownedValidBlocksUsers.add(entry.name)
                }
            }
        }
        if (!unownedValidBlocksUsers.isEmpty()) {
            throw new GradleException(
                "Paper donor contains unowned Craft/Spigot classes that directly depend on patched BlockEntityType.validBlocks access: " +
                unownedValidBlocksUsers.sort().join(', ') +
                '. Add LunarArc-owned implementations or narrow bridges before donating these classes.'
            )
        }

        int donatedClasses = 0
        int ownedClasses = 0
        List<String> blockImplClasses = []
        new java.util.jar.JarFile(paperJar).withCloseable { jar ->
            def entries = jar.entries()
            while (entries.hasMoreElements()) {
                def entry = entries.nextElement()
                if (entry.directory || !entry.name.endsWith('.class')) continue

                // Keep the donor boundary narrow: CraftBukkit/Spigot implementation surface,
                // plus Paper's own config framework (io.papermc.paper.configuration.*) - a
                // small, loader-independent Configurate/Adventure utility layer that
                // PaperPluginMeta (LunarArc-owned) needs at runtime and that plugin.yml/
                // paper-plugin.yml parsing depends on. Paper API is already a normal
                // dependency and Minecraft/NMS stays exclusively loader-owned; the
                // verify*HybridShape tasks reject any net.minecraft class that slips in.
                boolean surfaceClass = entry.name.startsWith('org/bukkit/craftbukkit/') ||
                    entry.name.startsWith('org/spigotmc/') ||
                    entry.name.startsWith('io/papermc/paper/configuration/')
                if (!surfaceClass) continue

                if (ownsPaperImplementationClass(entry.name)) {
                    ownedClasses++
                    continue
                }

                byte[] classBytes = jar.getInputStream(entry).withCloseable { it.readAllBytes() }
                classBytes = neutralizeMojangLogUtils(classBytes)

                File target = new File(outputDir, entry.name)
                target.parentFile.mkdirs()
                target.bytes = classBytes
                donatedClasses++

                if (entry.name.startsWith('org/bukkit/craftbukkit/block/impl/') &&
                        !entry.name.contains('$')) {
                    blockImplClasses.add(entry.name.substring(0, entry.name.length() - 6).replace('/', '.'))
                }
            }
        }

        File listFile = new File(outputDir, 'META-INF/lunararc/paper-block-impl.list')
        listFile.parentFile.mkdirs()
        listFile.text = blockImplClasses.sort().join(System.lineSeparator()) + System.lineSeparator()

        if (donatedClasses < 100) {
            throw new GradleException(
                "Paper 1.21.1 implementation donor extracted only ${donatedClasses} classes; expected a full CraftBukkit/Spigot surface"
            )
        }
        if (blockImplClasses.size() < 100) {
            throw new GradleException(
                "Paper 1.21.1 implementation donor found only ${blockImplClasses.size()} generated block implementations"
            )
        }
        logger.lifecycle(
            "Prepared exact Paper 1.21.1 implementation surface: ${donatedClasses} donated classes, " +
            "${ownedClasses} LunarArc-owned classes retained, ${blockImplClasses.size()} generated block implementations"
        )
    }
}

// Treat the exact Paper 1.21.1 donor as compiled common output, not as a raw final-JAR
// overlay. Architectury/Loom therefore transforms/remaps these classes for each loader.
sourceSets.main.output.dir([builtBy: tasks.named('preparePaperImplementationSurface')], generatedPaperImplementationSurfaceDir)

tasks.named('classes') { dependsOn tasks.named('preparePaperImplementationSurface') }