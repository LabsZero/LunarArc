def generatedIncompatibilityDir = layout.buildDirectory.dir('generated/incompatibility')

tasks.register('generateIncompatibilityList') {
    def source = rootProject.file('gradle/incompatibility.toml')
    def output = generatedIncompatibilityDir.map { it.file('lunararc/incompatibility.tsv').asFile }
    inputs.file(source)
    outputs.file(output)

    doLast {
        def target = output.get()
        target.parentFile.mkdirs()

        def rows = []
        def section = null
        def current = null
        def lineNumber = 0

        def flush = {
            if (current == null) return
            if (!current.name) {
                throw new GradleException("gradle/incompatibility.toml: [[${current.section}]] entry ending at line ${lineNumber} has no name")
            }
            if (!current.reason) {
                throw new GradleException("gradle/incompatibility.toml: ${current.section} entry '${current.name}' has no reason")
            }
            rows << "${current.section}\t${current.name}\t${current.version ?: ''}\t${current.reason}"
            current = null
        }

        source.eachLine { String raw ->
            lineNumber++
            def line = raw.trim()
            if (line.isEmpty() || line.startsWith('#')) return

            def header = (line =~ /^\[\[(plugins|mods)]]$/)
            if (header.matches()) {
                flush()
                section = header[0][1]
                current = [section: section, name: null, version: null, reason: null]
                return
            }

            def pair = (line =~ /^(name|version|reason)\s*=\s*"(.*)"$/)
            if (pair.matches()) {
                if (current == null) {
                    throw new GradleException("gradle/incompatibility.toml:${lineNumber}: '${line}' appears before any [[plugins]] or [[mods]] header")
                }
                current[pair[0][1]] = pair[0][2]
                return
            }

            throw new GradleException("gradle/incompatibility.toml:${lineNumber}: cannot parse '${line}'. Expected [[plugins]], [[mods]], or key = \"value\".")
        }
        flush()

        target.text = rows.isEmpty() ? '' : rows.join('\n') + '\n'
        logger.lifecycle("Generated LunarArc incompatibility list with ${rows.size()} entries")
    }
}
sourceSets.main.resources.srcDir(generatedIncompatibilityDir)

