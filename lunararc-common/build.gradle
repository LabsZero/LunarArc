}

def generatedPaperImplementationSurfaceDir = layout.buildDirectory.dir('generated/paper-1.21.1-implementation-surface')

def ownsPaperImplementationClass = { String classEntry ->
    if (!classEntry.endsWith('.class')) return false
    String topLevel = classEntry.substring(0, classEntry.length() - '.class'.length())
    int inner = topLevel.indexOf('$')
    if (inner >= 0) topLevel = topLevel.substring(0, inner)
    File javaSource = project.file("src/main/java/${topLevel}.java")
    return javaSource.isFile()
}

tasks.register('verifyCraftNmsOwnership') {
    group = 'verification'
    description = 'Ensures CraftBlockStates is LunarArc-owned and derives BlockEntityType membership only through the public isValid(BlockState) API, never through BlockEntityType.validBlocks.'

    doLast {
        File craftBlockStates = project.file('src/main/java/org/bukkit/craftbukkit/block/CraftBlockStates.java')

        if (!craftBlockStates.isFile()) {
            throw new GradleException('Craft/NMS ownership check failed: CraftBlockStates must be a LunarArc-owned source file')
        }

        String craftSource = craftBlockStates.getText('UTF-8')
        if (craftSource =~ /(?m)^\s*[^\/\s].*\bblockEntityType\.validBlocks\b/) {
            throw new GradleException('CraftBlockStates must not directly access BlockEntityType.validBlocks; use the public isValid(BlockState) method instead')
        }
        // Current architecture (replaces the earlier BlockEntityTypeAccessBridge Mixin
        // approach, removed as obsolete): derive block membership via vanilla's own public
        // BlockEntityType#isValid(BlockState), which needs no private-field access and no
        // Mixin accessor at all.
        if (!craftSource.contains('blockEntityType.isValid(')) {
            throw new GradleException('CraftBlockStates is not deriving BlockEntityType membership through the public isValid(BlockState) API')
        }

        if (!craftSource.contains('GENERIC_BLOCK_ENTITY_FACTORY') || !craftSource.contains('return GENERIC_BLOCK_ENTITY_FACTORY')) {
            throw new GradleException('CraftBlockStates must retain the generic loader/mod BlockEntityType fallback')
        }
    }
}

tasks.register('preparePaperImplementationSurface') {
    dependsOn tasks.named('verifyCraftNmsOwnership')
    group = 'build setup'
    description = 'Extracts missing exact Paper 1.21.1 CraftBukkit/Spigot implementation classes, plus Paper\'s own loader-independent config framework (io.papermc.paper.configuration.*), for loader remapping.'
    dependsOn rootProject.tasks.named('preparePaperCompileReference')
    inputs.file(rootProject.ext.paperServerJar)
    inputs.files(configurations.paperApiReference)
    inputs.files(fileTree('src/main/java') {
        include 'org/bukkit/craftbukkit/**/*.java'
        include 'org/spigotmc/**/*.java'
        include 'io/papermc/paper/configuration/**/*.java'
    })
    outputs.dir(generatedPaperImplementationSurfaceDir)

    doLast {
        File outputDir = generatedPaperImplementationSurfaceDir.get().asFile
        project.delete(outputDir)
        outputDir.mkdirs()

        File paperJar = rootProject.ext.paperServerJar
        if (!paperJar.isFile()) {
            throw new GradleException("Paper 1.21.1 implementation reference is missing: ${paperJar}")
        }

        List<String> unownedValidBlocksUsers = []
        new java.util.jar.JarFile(paperJar).withCloseable { auditJar ->
            auditJar.entries().each { entry ->
                if (entry.directory || !entry.name.endsWith('.class')) return
                if (!(entry.name.startsWith('org/bukkit/craftbukkit/') || entry.name.startsWith('org/spigotmc/'))) return
                if (ownsPaperImplementationClass(entry.name)) return
                byte[] bytes = auditJar.getInputStream(entry).withCloseable { it.readAllBytes() }
                String constants = new String(bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                if (constants.contains('net/minecraft/world/level/block/entity/BlockEntityType') &&
                        constants.contains('validBlocks')) {
                    unownedValidBlocksUsers.add(entry.name)
                }
            }
        }
        if (!unownedValidBlocksUsers.isEmpty()) {
            throw new GradleException(
                "Paper donor contains unowned Craft/Spigot classes that directly depend on patched BlockEntityType.validBlocks access: " +
                unownedValidBlocksUsers.sort().join(', ') +
                '. Add LunarArc-owned implementations or narrow bridges before donating these classes.'
            )
        }

        int donatedClasses = 0
        int ownedClasses = 0
        List<String> blockImplClasses = []
        Set<String> surfaceEntryNames = new HashSet<>()
        Map<String, Set<String>> paperRefsByDonor = new TreeMap<>()
        // Single-quoted so Groovy leaves the '$' of inner-class names alone.
        def paperTypeReferencePattern = java.util.regex.Pattern.compile('io/papermc/paper/[A-Za-z0-9_$/]+')
        new java.util.jar.JarFile(paperJar).withCloseable { jar ->
            def entries = jar.entries()
            while (entries.hasMoreElements()) {
                def entry = entries.nextElement()
                if (entry.directory || !entry.name.endsWith('.class')) continue

                // Keep the donor boundary narrow: CraftBukkit/Spigot implementation surface,
                // plus Paper's own config framework (io.papermc.paper.configuration.*) - a
                // small, loader-independent Configurate/Adventure utility layer that
                // PaperPluginMeta (LunarArc-owned) needs at runtime and that plugin.yml/
                // paper-plugin.yml parsing depends on. Paper API is already a normal
                // dependency and Minecraft/NMS stays exclusively loader-owned; the
                // verify*HybridShape tasks reject any net.minecraft class that slips in.
                boolean surfaceClass = entry.name.startsWith('org/bukkit/craftbukkit/') ||
                    entry.name.startsWith('org/spigotmc/') ||
                    entry.name.startsWith('io/papermc/paper/configuration/')
                if (!surfaceClass) continue
                // Both donated and LunarArc-owned surface classes end up in the compiled
                // output, so both count as resolvable for the audit below.
                surfaceEntryNames.add(entry.name)

                if (ownsPaperImplementationClass(entry.name)) {
                    ownedClasses++
                    continue
                }

                byte[] classBytes = jar.getInputStream(entry).withCloseable { it.readAllBytes() }
                classBytes = neutralizeMojangLogUtils(classBytes)

                // Record every io/papermc/paper/** type this donated class names, so the audit
                // below can tell whether it will still be there at runtime. Reading the constant
                // pool as text is the same technique the validBlocks audit above uses; it can
                // over-report (a string literal that happens to look like a class name) but it
                // never under-reports, which is the direction that matters for a missing class.
                String donatedConstants = new String(classBytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                def matcher = paperTypeReferencePattern.matcher(donatedConstants)
                Set<String> found = new TreeSet<>()
                while (matcher.find()) found.add(matcher.group())
                if (!found.isEmpty()) paperRefsByDonor.put(entry.name, found)

                File target = new File(outputDir, entry.name)
                target.parentFile.mkdirs()
                target.bytes = classBytes
                donatedClasses++

                if (entry.name.startsWith('org/bukkit/craftbukkit/block/impl/') &&
                        !entry.name.contains('$')) {
                    blockImplClasses.add(entry.name.substring(0, entry.name.length() - 6).replace('/', '.'))
                }
            }
        }

        File listFile = new File(outputDir, 'META-INF/lunararc/paper-block-impl.list')
        listFile.parentFile.mkdirs()
        listFile.text = blockImplClasses.sort().join(System.lineSeparator()) + System.lineSeparator()

        if (donatedClasses < 100) {
            throw new GradleException(
                "Paper 1.21.1 implementation donor extracted only ${donatedClasses} classes; expected a full CraftBukkit/Spigot surface"
            )
        }
        if (blockImplClasses.size() < 100) {
            throw new GradleException(
                "Paper 1.21.1 implementation donor found only ${blockImplClasses.size()} generated block implementations"
            )
        }
        // Donated Paper classes can name Paper's own server-internal helpers, which the donor
        // boundary deliberately does not carry and which LunarArc may not own either. Nothing
        // fails at build time when one is missing - the class links fine against the compileOnly
        // paper-server jar - and nothing fails at boot either. It fails the first time a plugin
        // touches that code path, as a NoClassDefFoundError from inside Paper's own class
        // initializer, which reads like a broken plugin rather than a missing class.
        //
        // That is exactly how Commodore stayed dead here: it needs
        // io.papermc.paper.util.MappingEnvironment and io.papermc.paper.pluginremap.reflect.
        // ReflectionRemapper, neither of which existed, so no plugin ever got Paper's API-level
        // rewrites. This audit names that shape of gap at build time instead.
        Set<String> resolvable = new HashSet<>(surfaceEntryNames)
        project.fileTree('src/main/java') { include 'io/papermc/paper/**/*.java' }.each { File source ->
            String relative = source.absolutePath.substring(
                project.file('src/main/java').absolutePath.length() + 1).replace(File.separator, '/')
            resolvable.add(relative.substring(0, relative.length() - '.java'.length()) + '.class')
        }
        configurations.paperApiReference.each { File dependency ->
            if (!dependency.name.endsWith('.jar')) return
            new java.util.jar.JarFile(dependency).withCloseable { apiJar ->
                apiJar.entries().each { apiEntry ->
                    if (apiEntry.name.startsWith('io/papermc/paper/') && apiEntry.name.endsWith('.class')) {
                        resolvable.add(apiEntry.name)
                    }
                }
            }
        }

        Map<String, Set<String>> missingByType = new TreeMap<>()
        paperRefsByDonor.each { String donor, Set<String> references ->
            references.each { String reference ->
                // Inner classes live in their outer class's file; resolving the outer one is
                // enough to know the type will be present.
                String topLevel = reference.contains('$') ? reference.substring(0, reference.indexOf('$')) : reference
                if (resolvable.contains(topLevel + '.class')) return
                Set<String> donorsForType = missingByType.get(topLevel)
                if (donorsForType == null) {
                    donorsForType = new TreeSet<>()
                    missingByType.put(topLevel, donorsForType)
                }
                donorsForType.add(donor)
            }
        }

        if (missingByType.isEmpty()) {
            logger.lifecycle("Paper donor dependency audit: all io.papermc.paper references from donated classes resolve")
        } else {
            // Reported rather than thrown for now: the reference scan reads the constant pool as
            // text, so a name that only ever appears in a string literal can show up here without
            // being a real link-time dependency. Tighten this to a hard failure once the reported
            // list has been walked once and is understood.
            logger.warn("Paper donor dependency audit: ${missingByType.size()} io.papermc.paper type(s) referenced by " +
                "donated Paper classes are neither donated, LunarArc-owned, nor present in paper-api. " +
                "Each is a NoClassDefFoundError waiting for the first plugin that reaches it:")
            missingByType.each { String type, Set<String> donors ->
                String sample = donors.take(3).join(', ')
                logger.warn("  ${type.replace('/', '.')}  <- ${sample}${donors.size() > 3 ? " (+${donors.size() - 3} more)" : ''}")
            }
        }

        logger.lifecycle(
            "Prepared exact Paper 1.21.1 implementation surface: ${donatedClasses} donated classes, " +
            "${ownedClasses} LunarArc-owned classes retained, ${blockImplClasses.size()} generated block implementations"
        )
    }
}

// Treat the exact Paper 1.21.1 donor as compiled common output, not as a raw final-JAR
// overlay. Architectury/Loom therefore transforms/remaps these classes for each loader.
sourceSets.main.output.dir([builtBy: tasks.named('preparePaperImplementationSurface')], generatedPaperImplementationSurfaceDir)

tasks.named('classes') { dependsOn tasks.named('preparePaperImplementationSurface') }
// Mixin refuses to apply a mixin class that declares a non-private static method - see
// MixinApplicatorStandard.checkMethodVisibility - and the only exemptions are @Overwrite (which
// needs the method to already exist in the target) and synthetic methods. Nothing catches this at
// compile time: the annotation processor is happy, the build is green, and the failure arrives at
// runtime as an InvalidMixinException during MAIN Applicator Phase, which on NeoForge kills the
// JVM inside ServerModLoader.load before the server exists at all. That is as expensive as a
// mistake gets, and it is a one-line mistake to make, so it is checked here instead.
tasks.register('verifyMixinStaticVisibility') {
    group = 'verification'
    description = 'Fails if any @Mixin class declares a non-private static method, which Mixin rejects at apply time.'

    def mixinSources = rootProject.fileTree(rootProject.projectDir) {
        include '*/src/*/java/**/mixin/**/*.java'
    }
    inputs.files(mixinSources).withPropertyName('mixinSources')

    doLast {
        def methodPattern = java.util.regex.Pattern.compile(
            '^(?:(public|protected)\\s+static|static)\\s+[\\w<>\\[\\],.?\\s]+\\s+\\w+\\s*\\(')
        List<String> offenders = []

        mixinSources.each { File source ->
            String text = source.getText('UTF-8')
            if (!text.contains('@Mixin')) return

            String[] lines = text.readLines() as String[]
            for (int index = 0; index < lines.length; index++) {
                String line = lines[index].trim()
                if (line.startsWith('//') || line.startsWith('*')) continue
                if (!methodPattern.matcher(line).find()) continue

                // @Overwrite is the one legal way to declare a non-private static in a mixin, and
                // it may sit a few annotation lines above the declaration.
                boolean overwrite = false
                for (int back = index - 1; back >= 0 && back >= index - 6; back--) {
                    String previous = lines[back].trim()
                    if (previous.isEmpty()) continue
                    if (previous.contains('@Overwrite')) { overwrite = true; break }
                    if (!previous.startsWith('@')) break
                }
                if (overwrite) continue

                String relative = rootProject.relativePath(source)
                offenders.add("  ${relative}:${index + 1}  ${line}")
            }
        }

        if (!offenders.isEmpty()) {
            throw new GradleException(
                "Mixin classes must not declare non-private static methods - Mixin throws " +
                "InvalidMixinException at apply time and the server dies before it starts. " +
                "Make the method private, move it to a normal helper class, or use @Overwrite if " +
                "the target already declares it:\n" + offenders.join('\n'))
        }
        logger.lifecycle("Mixin static visibility check passed for ${mixinSources.files.size()} mixin source(s)")
    }
}

tasks.named('classes') { dependsOn tasks.named('verifyMixinStaticVisibility') }

// LunarArc supplies CraftBukkit's added Minecraft members by mixin, because it cannot patch
// Minecraft the way CraftBukkit does. Paper's own CraftBukkit classes - the ones donated verbatim
// rather than reimplemented - are compiled against CraftBukkit's exact signatures, and the JVM
// resolves calls on the full descriptor. A mixin-added member with the right name but a different
// return type therefore does not satisfy them: the call fails at runtime with NoSuchMethodError
// while the method visibly exists, which is as quiet as a bug gets. Entity.getBukkitEntity()
// returned the org.bukkit.entity.Entity interface where CraftBukkit returns CraftEntity for
// exactly this reason, and nothing caught it.
tasks.register('verifyCraftBukkitMemberParity') {
    group = 'verification'
    description = 'Compares mixin-added members carrying CraftBukkit names against CraftBukkit\'s own signatures.'

    def reference = rootProject.file('gradle/reference/craftbukkit-nms-members.txt')
    def mixinSources = rootProject.fileTree(rootProject.projectDir) {
        include '*/src/*/java/**/mixin/**/*.java'
    }
    inputs.file(reference)
    inputs.files(mixinSources).withPropertyName('mixinSources')

    doLast {
        // owner simple name -> (method -> return type), as CraftBukkit declares it.
        Map<String, Map<String, String>> expected = [:]
        reference.eachLine { String line ->
            if (line.startsWith('#') || line.trim().isEmpty()) return
            def parts = line.split('\\|')
            if (parts.length != 3) return
            String simple = parts[0].substring(parts[0].lastIndexOf('.') + 1)
            expected.computeIfAbsent(simple, { [:] }).put(parts[1], parts[2])
        }

        def modifiers = ['final', 'static', 'synchronized', 'abstract', 'transient', 'native',
                         'default', 'strictfp'] as Set
        def declaration = java.util.regex.Pattern.compile(
            '^\\s*public\\s+([\\w.<>\\[\\],? ]+?)\\s+(\\w+)\\s*\\(')
        def mixinTarget = java.util.regex.Pattern.compile(
            '@Mixin\\s*\\(\\s*(?:value\\s*=\\s*)?(\\w+)\\.class')

        List<String> mismatches = []
        int checked = 0

        mixinSources.each { File source ->
            String text = source.getText('UTF-8')
            if (!text.contains('@Mixin')) return
            def target = mixinTarget.matcher(text)
            if (!target.find()) return
            Map<String, String> owned = expected.get(target.group(1))
            if (owned == null) return

            text.readLines().each { String line ->
                def matcher = declaration.matcher(line)
                if (!matcher.find()) return
                String name = matcher.group(2)
                // lunararc$-prefixed members are LunarArc's own bridge surface, deliberately named
                // so they cannot collide with anything Minecraft or a loader declares.
                if (name.startsWith('lunararc')) return
                String declared = owned.get(name)
                if (declared == null) return

                String ours = matcher.group(1).trim().split('\\s+')
                        .findAll { !modifiers.contains(it) }.join(' ')
                checked++
                if (simpleTypeName(ours) != simpleTypeName(declared)) {
                    mismatches.add("  ${target.group(1)}#${name}: LunarArc declares ${ours}, " +
                                   "CraftBukkit declares ${declared}  [${rootProject.relativePath(source)}]")
                }
            }
        }

        if (mismatches.isEmpty()) {
            logger.lifecycle("CraftBukkit member parity: ${checked} mixin-added member(s) match CraftBukkit's signatures")
        } else {
            // Reported rather than thrown while the comparison is by source text and simple name:
            // it can disagree on a type that is spelled differently but resolves the same. Tighten
            // to a hard failure once the reported list has been walked and stays empty.
            logger.warn("CraftBukkit member parity: ${mismatches.size()} mixin-added member(s) do not match " +
                        "CraftBukkit's signature. Donated Paper code calling these fails at runtime with " +
                        "NoSuchMethodError even though the method exists:")
            mismatches.each { logger.warn(it) }
        }
    }
}

// Compared on the simple name: LunarArc writes some of these fully qualified and some imported,
// and CraftBukkit's own sources vary the same way, so the package prefix carries no signal here.
static String simpleTypeName(String type) {
    String bare = type.replaceAll('<.*>', '').trim()
    return bare.substring(bare.lastIndexOf('.') + 1)
}

tasks.named('classes') { dependsOn tasks.named('verifyCraftBukkitMemberParity') }
