pluginManagement {
    repositories {
        maven { url 'https://maven.fabricmc.net/' }
        maven { url 'https://maven.architectury.dev/' }
        maven { url 'https://maven.minecraftforge.net/' }
        maven { url 'https://repo.papermc.io/repository/maven-public/' }
        maven { url 'https://maven.neoforged.net/releases' }
        gradlePluginPortal()
    }
}

rootProject.name = 'LunarArc'

// Shared API surface
include 'api'
project(':api').projectDir = file('projects/api')

// Common hybrid-server implementation (mixins, bridges, Paper stubs, remapper)
// Analogous to arclight-common / io.ampznetwork.lunararc.common.*
include 'lunararc-common'
project(':lunararc-common').projectDir = file('projects/base')

// Platform-specific implementations
// Analogous to arclight-neoforge / arclight-forge / arclight-fabric
include 'lunararc-neoforge'
project(':lunararc-neoforge').projectDir = file('projects/core')

include 'lunararc-forge'
project(':lunararc-forge').projectDir = file('projects/loaders/forge')

include 'lunararc-fabric'
project(':lunararc-fabric').projectDir = file('projects/loaders/fabric')

include 'lunararc-quilt'
project(':lunararc-quilt').projectDir = file('projects/loaders/quilt')

// Installer — installs mod loaders automatically at runtime (analogous to installer subproject)
include 'installer'
project(':installer').projectDir = file('projects/launcher')

// Internationalisation (analogous to i18n-config)
include 'i18n'
project(':i18n').projectDir = file('projects/i18n')

// Bootstrap fat-jar assembly and relocated dependency library
include 'bootstrap'
include 'libs'
project(':libs').projectDir = file('projects/libs')
