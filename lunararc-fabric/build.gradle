plugins {
    id 'architectury-plugin'
    id 'dev.architectury.loom'
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    silentMojangMappingsLicense()
    accessWidenerPath = project(':lunararc-common').file('src/main/resources/lunararc.accesswidener')
}

// lunararc-common is compiled against Mojang names, and so are the Paper implementation classes
// donated into its output. Fabric Loader runs a production server on intermediary names, so
// nothing named survives contact with it: the mixin config's very first entry died with
// "@Mixin target net.minecraft.server.commands.EffectCommands was not found", which is the Mojang
// name of a class the loader only knows as net.minecraft.class_3054.
//
// The fix is the same shape lunararc-forge already uses (and the one Architectury's own multi
// loader layout prescribes): pull the common project's transformProductionFabric output into a
// shadowJar, then hand that to remapJar so Loom remaps common and platform classes together,
// named -> intermediary, in one pass. Depending on lunararc-common with a plain `implementation`
// left its classes outside remapJar entirely, so they shipped in the named namespace.
configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    minecraft libs.minecraft
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${libs.versions.minecraft.get()}:${libs.versions.parchment.get()}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${libs.versions.fabric.loader.get()}"
    modImplementation libs.fabric.api
    common(project(path: ':lunararc-common', configuration: 'namedElements')) { transitive = false }
    shadowBundle(project(path: ':lunararc-common', configuration: 'transformProductionFabric')) { transitive = false }
    implementation project(':lunararc-api')
    shadowBundle project(':lunararc-api')
    implementation libs.paper.api
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'project_name', rootProject.name
    inputs.property 'minecraft', libs.versions.minecraft.get()
    inputs.property 'fabric_loader', libs.versions.fabric.loader.get()
    inputs.property 'java_runtime', libs.versions.java.runtime.get()
    filesMatching('fabric.mod.json') {
        expand version: project.version, project_name: rootProject.name,
               minecraft: libs.versions.minecraft.get(), fabric_loader: libs.versions.fabric.loader.get(),
               java_runtime: libs.versions.java.runtime.get()
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier.set('dev-shadow')
    exclude 'quilt.mod.json'
    exclude 'META-INF/mods.toml'
    exclude 'META-INF/neoforge.mods.toml'
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
}
