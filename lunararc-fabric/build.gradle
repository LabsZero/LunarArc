plugins {
    id 'architectury-plugin'
    id 'dev.architectury.loom-no-remap'
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    silentMojangMappingsLicense()
    accessWidenerPath = project(':lunararc-common').file('src/main/resources/lunararc.accesswidener')
}

configurations {
    permissionsBundle {
        canBeResolved = true
        canBeConsumed = false
    }
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    minecraft libs.minecraft
    implementation "net.fabricmc:fabric-loader:${libs.versions.fabric.loader.get()}"
    implementation libs.fabric.api
    implementation(libs.fabric.permissions.api) { transitive = false }
    // jar-in-jar (include) needs the remap step, which no-remap Loom does not have, so bundle the classes instead
    permissionsBundle(libs.fabric.permissions.api) { transitive = false }
    common(project(path: ':lunararc-common')) { transitive = false }
    shadowBundle(project(path: ':lunararc-common', configuration: 'transformProductionFabric')) { transitive = false }
    implementation libs.lunararc.api
    shadowBundle libs.lunararc.api
    implementation libs.paper.api
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'project_name', rootProject.name
    inputs.property 'minecraft', libs.versions.minecraft.get()
    inputs.property 'fabric_loader', libs.versions.fabric.loader.get()
    inputs.property 'java_runtime', libs.versions.java.runtime.get()
    filesMatching('fabric.mod.json') {
        expand version: project.version, project_name: rootProject.name,
               minecraft: libs.versions.minecraft.get(), fabric_loader: libs.versions.fabric.loader.get(),
               java_runtime: libs.versions.java.runtime.get()
    }
}

shadowJar {
    from({ project.configurations.permissionsBundle.collect { zipTree(it) } }) {
        exclude 'fabric.mod.json'
        exclude 'quilt.mod.json'
        exclude 'META-INF/MANIFEST.MF'
    }
    configurations = [project.configurations.shadowBundle]
    archiveClassifier.set('dev-shadow')
    exclude 'quilt.mod.json'
    exclude 'META-INF/mods.toml'
    exclude 'META-INF/neoforge.mods.toml'
}

