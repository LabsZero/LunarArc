
plugins {
    id 'architectury-plugin'
    id 'dev.architectury.loom-no-remap'
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    silentMojangMappingsLicense()
    accessWidenerPath = project(':lunararc-common').file('src/main/resources/lunararc.accesswidener')
    forge {
        useCustomMixin = false
        mixinConfigs = ['mixins.lunararc.common.json', 'mixins.lunararc.forge.json']
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    minecraft libs.minecraft
    forge "net.minecraftforge:forge:${libs.versions.minecraft.get()}-${libs.versions.forge.get()}"
    common(project(path: ':lunararc-common')) { transitive = false }
    shadowBundle(project(path: ':lunararc-common', configuration: 'transformProductionForge')) { transitive = false }

    // NeoForge/Fabric/Quilt all bundle MixinExtras themselves; Forge's own runtime does not.
    // bootstrap's forgeCommonJar bundles a relocated copy of the runtime jar directly into
    // common.jar instead of shading it in here, so this is compile-only just so
    // LunarArcMixinExtrasConnector_Forge and the shared mixins can still reference it.
    compileOnly libs.mixinextras.common

    implementation libs.lunararc.api
    shadowBundle libs.lunararc.api
    implementation libs.paper.api
}

apply from: rootProject.file('gradle/generate-access-transformer.gradle')

processResources {
    def ver = project.version.toString()
    inputs.property 'version', ver
    filesMatching('META-INF/mods.toml') {
        expand version: ver
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier.set('dev-shadow')
    manifest {
        attributes 'MixinConfigs': 'mixins.lunararc.common.json,mixins.lunararc.forge.json'
    }
    exclude 'fabric.mod.json'
    exclude 'quilt.mod.json'
}
